<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sinterklaas QR-code</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="kaart">
    <img class="logo" src="images/logo.png" alt="" onerror="this.style.display='none'">
    <h1>Sinterklaas QR-code</h1>
    <p class="intro">Vul je code van 4 cijfers in en druk op Gereed.</p>

    <div class="invoer">
      <input id="code" type="text" inputmode="numeric" maxlength="4"
             pattern="[0-9]{4}" placeholder="0000" autocomplete="off"
             aria-label="Code van 4 cijfers">
      <button id="gereed" type="button">Gereed</button>
    </div>

    <p id="melding" class="melding" role="alert"></p>

    <div id="qr" class="qr" aria-live="polite"></div>
    <p id="qr-tekst" class="qr-tekst"></p>
  </main>

  <script src="qrcode.js"></script>
  <script src="script.js"></script>
</body>
</html>
